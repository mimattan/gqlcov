name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Test with coverage (every package must stay at 99% or more)
        run: npm run test:coverage
      - name: Example E2E loop (capture, report, gate)
        run: cd examples/yoga-e2e && npm run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: example-gqlcov-report
          path: examples/yoga-e2e/.gqlcov/report.*
